services:
  - type: web
    name: lumora-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://lumora-ai-s.web.app","https://lumora-ai-s.firebaseapp.com","https://one-for-all-5e842.web.app","https://one-for-all-5e842.firebaseapp.com","https://*.web.app","https://*.firebaseapp.com","https://lumora.ai","https://*.render.com","https://*.vercel.app","http://localhost:3000"]'
      - key: DETECTOR_MODEL_VERSION
        value: lumora-ensemble-v1.0.4
      - key: HUMANIZER_MODEL_VERSION
        value: lumora-humanizer-v1.2.0
    healthCheckPath: /health
