services:
  - type: web
    name: lumora-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://lumora.ai","https://*.vercel.app"]'
      - key: DETECTOR_MODEL_VERSION
        value: lumora-ensemble-v1.0.4
      - key: HUMANIZER_MODEL_VERSION
        value: lumora-humanizer-v1.2.0
    healthCheckPath: /health
