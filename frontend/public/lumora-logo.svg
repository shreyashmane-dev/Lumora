<svg width="256" height="64" viewBox="0 0 256 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background / Obsidian bevel -->
    <linearGradient id="lumora-bezel" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="80%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Specular highlight stroke -->
    <linearGradient id="lumora-specular" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)"/>
      <stop offset="25%" stop-color="rgba(168, 85, 247, 0.4)"/>
      <stop offset="70%" stop-color="rgba(6, 182, 212, 0.3)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)"/>
    </linearGradient>

    <!-- Refractive Core Gradient -->
    <linearGradient id="lumora-core" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="lumora-text-grad" x1="76" y1="20" x2="210" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON BADGE (0 to 64) -->
  <g transform="translate(0, 0)">
    <!-- Obsidian Prism Bevel Container -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lumora-bezel)" stroke="url(#lumora-specular)" stroke-width="1.2"/>

    <!-- Subtle Hexagonal Geometry Wireframe -->
    <polygon points="32,10 50,21 50,43 32,54 14,43 14,21" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" fill="none"/>
    <polygon points="32,18 43,25 43,39 32,46 21,39 21,25" stroke="rgba(6, 182, 212, 0.25)" stroke-width="0.8" fill="none"/>

    <!-- Refractive Facet Shards -->
    <polygon points="32,10 50,21 32,32" fill="url(#lumora-core)" fill-opacity="0.2"/>
    <polygon points="32,54 14,43 32,32" fill="url(#lumora-core)" fill-opacity="0.15"/>
    <polygon points="50,43 32,54 32,32" fill="url(#lumora-core)" fill-opacity="0.3"/>

    <!-- The Quantum Quill (Stylometric Forensics Feather / Blade) -->
    <!-- Left Quill Plume -->
    <path d="M46 14C41 20 28 27 20 44C27 41 39 36 46 14Z" fill="url(#lumora-core)" fill-opacity="0.85"/>
    
    <!-- Right Feather Rib -->
    <path d="M46 14C38 23 33 34 26 48C31 43 40 31 46 14Z" fill="url(#lumora-core)" fill-opacity="0.55"/>

    <!-- Central Glowing Core Spine Line -->
    <line x1="46" y1="14" x2="19" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" filter="url(#laser-glow)"/>

    <!-- Quantum Energy Pips -->
    <circle cx="46" cy="14" r="2" fill="#E9D5FF" filter="url(#laser-glow)"/>
    <circle cx="19" cy="50" r="1.8" fill="#38BDF8" filter="url(#laser-glow)"/>
    <circle cx="33" cy="32" r="1.2" fill="#34D399"/>
  </g>

  <!-- WORDMARK (X: 74 onwards) -->
  <g transform="translate(76, 0)">
    <!-- Brand Title -->
    <text x="0" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="0.12em" fill="url(#lumora-text-grad)">LUMORA</text>
    
    <!-- Tagline / Intelligence Classification -->
    <text x="1" y="50" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.32em" fill="#94A3B8">AI WRITING INTEL</text>

    <!-- Accent Dot -->
    <circle cx="178" cy="22" r="2.5" fill="#06B6D4" filter="url(#laser-glow)"/>
  </g>
</svg>
