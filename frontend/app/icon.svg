<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon-bezel" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <linearGradient id="icon-specular" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)"/>
      <stop offset="35%" stop-color="rgba(168, 85, 247, 0.4)"/>
      <stop offset="70%" stop-color="rgba(6, 182, 212, 0.3)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>

    <linearGradient id="icon-core" x1="10" y1="8" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="14" fill="url(#icon-bezel)" stroke="url(#icon-specular)" stroke-width="1.2"/>
  
  <!-- Subtle Hexagonal Geometry -->
  <polygon points="24,8 38,16 38,32 24,40 10,32 10,16" stroke="rgba(139, 92, 246, 0.35)" stroke-width="0.8" fill="none"/>
  
  <!-- Facet Fill -->
  <polygon points="24,8 38,16 24,24" fill="url(#icon-core)" fill-opacity="0.25"/>
  <polygon points="38,32 24,40 24,24" fill="url(#icon-core)" fill-opacity="0.3"/>

  <!-- The Quantum Quill Stylometric Feather -->
  <path d="M35 11C31 16 21 21 15 34C20 32 30 28 35 11Z" fill="url(#icon-core)" fill-opacity="0.85"/>
  <path d="M35 11C29 18 25 26 20 37C24 33 30 24 35 11Z" fill="url(#icon-core)" fill-opacity="0.55"/>

  <!-- Laser Core Line -->
  <line x1="35" y1="11" x2="14" y2="38" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Focal Pips -->
  <circle cx="35" cy="11" r="1.5" fill="#E9D5FF"/>
  <circle cx="14" cy="38" r="1.5" fill="#38BDF8"/>
  <circle cx="25" cy="24" r="1" fill="#34D399"/>
</svg>
